# Trusted Weaver pull requests: validate, approve and label for landing.
#
# A pull request opened by a user listed in .github/WEAVERS.txt runs the content checks: schema
# validation of the changed Markdown and YAML files, the indexer's quality checks and the
# duplicate check. When every check passes, the workflow approves the pull request, adds the
# "landing" label and keeps one comment naming the guards that passed on the head it checked. A
# run whose checks fail takes the label off again.
#
# The workflow never merges and never turns on GitHub's auto-merge. Every pull request is merged
# only after its reviews and comments are read, fixed or answered and its threads resolved; a
# maintainer lands a labelled pull request once that pass is done.
name: Trusted Weavers

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

jobs:
  check-weaver-status:
    runs-on: ubuntu-latest
    outputs:
      is_weaver: ${{ steps.check.outputs.is_weaver }}
      username: ${{ steps.check.outputs.username }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Check if PR author is a trusted Weaver
        id: check
        run: |
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          echo "username=$PR_AUTHOR" >> $GITHUB_OUTPUT
          
          # Read WEAVERS.txt and check if author is listed
          if grep -q "^${PR_AUTHOR}$" .github/WEAVERS.txt; then
            echo "is_weaver=true" >> $GITHUB_OUTPUT
            echo "✅ $PR_AUTHOR is a trusted Weaver"
          else
            echo "is_weaver=false" >> $GITHUB_OUTPUT
            echo "ℹ️ $PR_AUTHOR is not in WEAVERS.txt"
          fi

  validate-content:
    needs: check-weaver-status
    if: needs.check-weaver-status.outputs.is_weaver == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run validation
        id: validate
        run: |
          # Get list of changed files
          git fetch origin main
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD | grep -E '\.(md|yaml|yml)$' || echo "")
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No content files changed"
            echo "validation_passed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Run validation on changed files
          npm run validate -- --files "$CHANGED_FILES"
          
          if [ $? -eq 0 ]; then
            echo "validation_passed=true" >> $GITHUB_OUTPUT
            echo "✅ Validation passed"
          else
            echo "validation_passed=false" >> $GITHUB_OUTPUT
            echo "❌ Validation failed"
            exit 1
          fi
      
      - name: Run indexer with quality checks
        if: steps.validate.outputs.validation_passed == 'true'
        run: |
          npm run index -- --validate
          
          if [ $? -ne 0 ]; then
            echo "⚠️ Indexer warnings found, but continuing"
          fi
      
      - name: Check for duplicates
        if: steps.validate.outputs.validation_passed == 'true'
        run: |
          npm run check-duplicates
          
          if [ $? -ne 0 ]; then
            echo "❌ Duplicate content detected"
            exit 1
          fi

  approve-and-label:
    needs: [check-weaver-status, validate-content]
    if: |
      needs.check-weaver-status.outputs.is_weaver == 'true' &&
      needs.validate-content.result == 'success'
    runs-on: ubuntu-latest
    
    steps:
      - name: Approve PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const author = context.payload.pull_request.user.login;
            
            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number,
              event: 'APPROVE',
              body: `✅ Approved: @${author} is a trusted Weaver and all validation checks passed.`
            });
      
      - name: Label for landing and name the guards that passed
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const author = context.payload.pull_request.user.login;
            const head = context.payload.pull_request.head.sha.slice(0, 7);
            const marker = '<!-- landing-guards -->';
            
            // Create the label on first use; a concurrent run may create it first (422).
            try {
              await github.rest.issues.getLabel({ owner, repo, name: 'landing' });
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: 'landing',
                  color: '0e8a16',
                  description: 'Checks and guards passed; lands after the comment pass'
                });
              } catch (createError) {
                if (createError.status !== 422) throw createError;
              }
            }
            
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['landing'] });
            
            const body = [
              marker,
              `Thank you @${author} for your contribution! Guards passed on ${head}:`,
              '',
              `- @${author} is a trusted Weaver (listed in \`.github/WEAVERS.txt\`)`,
              '- Schema validation of the changed Markdown and YAML files',
              '- The indexer quality checks',
              '- The duplicate check',
              '',
              'Labelled `landing`: this pull request lands after its review comments are read, answered and resolved. No workflow merges it.'
            ].join('\n');
            
            // One comment per pull request: a later run updates it.
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const previous = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  clear-landing-label:
    needs: [check-weaver-status, validate-content]
    # failure() keeps the job from being skipped when the validation job it needs has failed
    if: |
      failure() &&
      needs.check-weaver-status.outputs.is_weaver == 'true' &&
      needs.validate-content.result == 'failure'
    runs-on: ubuntu-latest
    
    steps:
      - name: Take the landing label off when the checks fail
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'landing' });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

  notify-non-weaver:
    needs: check-weaver-status
    if: needs.check-weaver-status.outputs.is_weaver == 'false'
    runs-on: ubuntu-latest
    
    steps:
      - name: Post welcome comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body: `👋 Thank you for your contribution @${{ needs.check-weaver-status.outputs.username }}!
              
              Your PR will be reviewed by our maintainers. While you wait:
              
              - ✅ Ensure all validation checks pass
              - 📝 Review the [contribution guidelines](../../wiki/codex/contributing.md)
              - 💬 Join our [Discord](https://wilds.ai/discord) for questions
              
              **Become a Weaver:** After 5+ high-quality contributions, you can be nominated as a trusted Weaver, whose pull requests are approved and labelled for landing once validation passes!`
            });

