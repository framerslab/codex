name: Test Suite

on:
  push:
    branches: [main, master]
    paths:
      - 'scripts/**'
      - 'schema/**'
      - 'tests/**'
      - 'lib/**'
      - 'vocab/**'
      - 'package.json'
      - 'vitest.config.js'
      # The licence badge reads LICENSE, and a change to this workflow tests itself on master.
      - 'LICENSE'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Every job reads; only Update Badges, which pushes the badges branch, gets contents: write.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Run unit tests
        run: pnpm test
      
      # The coverage run also writes Vitest's JSON report, which the tests badge counts.
      - name: Run tests with coverage
        run: pnpm exec vitest run --coverage --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-report.json"

      # One shields.io endpoint file per README badge (tests, coverage, version, licence), from this run and this tree.
      # Update Badges publishes them from master; on any other run they are only checked and archived.
      - name: Write the badge files
        run: node scripts/badges/write-badge-json.js --out "$RUNNER_TEMP/badges" --tests "$RUNNER_TEMP/vitest-report.json" --coverage coverage/coverage-summary.json

      - name: Archive coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Archive the badge files
        uses: actions/upload-artifact@v7
        with:
          name: badges
          path: ${{ runner.temp }}/badges/
          if-no-files-found: error
          retention-days: 7

  vocab-tests:
    name: Vocabulary & NLP Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Test vocabulary files exist
        run: |
          echo "📚 Checking vocabulary files..."
          for category in subjects topics difficulty skills; do
            if [ ! -d "vocab/$category" ]; then
              echo "❌ Missing vocab/$category directory"
              exit 1
            fi
            count=$(ls -1 vocab/$category/*.txt 2>/dev/null | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "❌ No .txt files in vocab/$category"
              exit 1
            fi
            echo "✅ vocab/$category: $count files"
          done
          
          if [ ! -f "vocab/stopwords.txt" ]; then
            echo "❌ Missing vocab/stopwords.txt"
            exit 1
          fi
          echo "✅ vocab/stopwords.txt exists"
      
      - name: Test vocab-loader
        run: |
          node -e "
            const { getVocabularyLoader } = require('./scripts/vocab-loader');
            const loader = getVocabularyLoader();
            const stats = loader.getStats();
            
            console.log('📊 Vocabulary Statistics:');
            console.log('   Stop words:', stats.stopWords);
            console.log('   Subjects:', Object.keys(stats.subjects).length, 'categories');
            console.log('   Topics:', Object.keys(stats.topics).length, 'categories');
            console.log('   Skills:', Object.keys(stats.skills || {}).length, 'categories');
            console.log('   Total terms:', stats.totalTerms);
            
            if (stats.stopWords < 50) throw new Error('Too few stop words');
            if (Object.keys(stats.subjects).length < 3) throw new Error('Too few subject categories');
            console.log('✅ Vocabulary loader working correctly');
          "
      
      - name: Test classification
        run: |
          node -e "
            const { getVocabularyLoader } = require('./scripts/vocab-loader');
            const loader = getVocabularyLoader();
            
            // Test technology detection
            const techResult = loader.classify('Programming APIs and software development with JavaScript and React');
            if (!techResult.subjects.includes('technology')) {
              throw new Error('Failed to detect technology subject');
            }
            console.log('✅ Technology subject detection works');
            
            // Test difficulty detection
            const beginnerResult = loader.classify('A basic introduction for beginners, simple and easy');
            if (beginnerResult.difficulty !== 'beginner') {
              throw new Error('Failed to detect beginner difficulty');
            }
            console.log('✅ Difficulty detection works');
            
            // Test skill detection
            const skillResult = loader.classify('Learn TypeScript and React hooks for modern frontend development');
            if (skillResult.skills.length === 0) {
              console.warn('⚠️ No skills detected (may need vocabulary expansion)');
            } else {
              console.log('✅ Skill detection works:', skillResult.skills.slice(0, 5).join(', '));
            }
          "

  cache-tests:
    name: Cache Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Test SQL cache functionality
        run: |
          echo "🗄️ Testing SQL cache..."
          
          # First run (full index)
          echo "📝 First run (cold cache):"
          time pnpm run index -- --validate 2>&1 | tail -20
          
          # Second run (should use cache)
          echo "📝 Second run (warm cache):"
          time pnpm run index -- --validate 2>&1 | tail -10
          
          # Verify cache was created (check for any .db file)
          if ls .cache/*.db 1>/dev/null 2>&1; then
            echo "✅ SQL cache working correctly"
          else
            echo "⚠️ No cache file found (using in-memory adapter)"
          fi
      
      - name: Test cache clear
        run: |
          pnpm run index -- --clear-cache
          echo "✅ Cache clear works"

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, vocab-tests]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Test full workflow
        run: |
          echo "🔄 Running full indexing workflow..."

          # Run validation (may have suggestions, don't fail)
          pnpm run validate || true

          # Run indexer
          pnpm run index -- --validate || true
          
          # Check outputs
          if [ ! -f codex-index.json ]; then
            echo "❌ Index not generated"
            exit 1
          fi
          
          if [ ! -f codex-report.json ]; then
            echo "❌ Report not generated"
            exit 1
          fi
          
          # Verify JSON is valid
          node -e "JSON.parse(require('fs').readFileSync('codex-index.json'))"
          node -e "JSON.parse(require('fs').readFileSync('codex-report.json'))"
          
          # Verify index has skills
          node -e "
            const index = JSON.parse(require('fs').readFileSync('codex-index.json'));
            const hasSkills = index.some(e => e.metadata?.autoGenerated?.skills?.length > 0);
            if (!hasSkills) {
              console.warn('⚠️ No auto-generated skills found in index');
            } else {
              console.log('✅ Skills found in index');
            }
          "
          
          echo "✅ Full workflow passed"
      
      - name: Verify index structure
        run: |
          node -e "
            const index = JSON.parse(require('fs').readFileSync('codex-index.json'));
            
            console.log('📊 Index Statistics:');
            console.log('   Total entries:', index.length);
            
            let withSummary = 0, withKeywords = 0, withSkills = 0, withTaxonomy = 0;
            
            for (const entry of index) {
              if (entry.metadata?.summary) withSummary++;
              if (entry.metadata?.autoGenerated?.keywords?.length) withKeywords++;
              if (entry.metadata?.autoGenerated?.skills?.length) withSkills++;
              if (entry.metadata?.taxonomy?.subjects?.length || entry.metadata?.taxonomy?.topics?.length) withTaxonomy++;
            }
            
            console.log('   With summary:', withSummary);
            console.log('   With keywords:', withKeywords);
            console.log('   With skills:', withSkills);
            console.log('   With taxonomy:', withTaxonomy);
            
            if (index.length < 3) throw new Error('Index too small');
            console.log('✅ Index structure valid');
          "
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: test-outputs
          path: |
            codex-index.json
            codex-report.json
            .cache/codex.db
          retention-days: 7

  # The README's tests, coverage, version and licence badges are shields.io endpoint badges, one JSON file per badge on
  # the badges branch. Unit Tests wrote the files from this run (scripts/badges/write-badge-json.js). This job replaces
  # the badges branch with them: one commit with no parent, pushed with a lease on the head it read
  # (scripts/badges/publish-badges-branch.sh). It never pushes to master. The README reads the files through jsDelivr,
  # because shields.io refuses any address whose host ends in github.com. It runs on master only, after the whole suite
  # passed, and one run at a time, so two runs never race for the lease. One at a time is in no set order, so a run of
  # an earlier commit can come after a later commit's run: the publisher reads master's history and leaves the later
  # commit's badges in place.
  update-badges:
    name: Update Badges
    runs-on: ubuntu-latest
    needs: [unit-tests, vocab-tests, cache-tests, integration]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 10
    permissions:
      contents: write # the badges branch
    concurrency:
      group: update-badges-master
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The publisher reads master's history to tell whether the branch already holds a later commit's badges.
          fetch-depth: 0

      - name: Download the badge files
        uses: actions/download-artifact@v8
        with:
          name: badges
          path: ${{ runner.temp }}/badges

      - name: Replace the badges branch
        env:
          BADGES_SOURCE_SHA: ${{ github.sha }}
          BADGES_SOURCE_RUN: ${{ github.run_number }}
        run: bash scripts/badges/publish-badges-branch.sh "$RUNNER_TEMP/badges"

      # jsDelivr keeps a branch's files for up to 12 hours, and a purge makes the badges read the new files now. A purge
      # that fails or is throttled warns, and that badge shows its old figure until jsDelivr's copy expires.
      - name: Purge jsDelivr's copies
        run: |
          for file in "$RUNNER_TEMP"/badges/*.json; do
            path="/gh/${GITHUB_REPOSITORY}@badges/$(basename "$file")"
            if response=$(curl -fsS --retry 3 --max-time 30 "https://purge.jsdelivr.net${path}") \
              && [ "$(jq -r --arg path "$path" '.paths[$path].throttled' <<< "$response")" = "false" ]; then
              echo "purged ${path}"
            else
              echo "::warning::jsDelivr did not purge ${path}; the badge shows its old figure until jsDelivr's copy expires (up to 12 hours)."
            fi
          done

