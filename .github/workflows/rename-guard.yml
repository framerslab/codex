name: rename-guard
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      rename_done:
        description: 'Run with RENAME_DONE=1 to list every public occurrence of the old names'
        type: boolean
        default: false
jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          package-manager-cache: false
      - name: Install without build scripts (the fixture test and the guard load no native module)
        # The repository's other workflows fail at their pnpm install when better-sqlite3 builds from source; this job needs
        # only the pure JavaScript readers (gray-matter, js-yaml, uuid, the vocabulary loader) and vitest.
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Compatibility fixtures and the format's schema files (today's weave, loom and strand files read unchanged)
        run: ./node_modules/.bin/vitest run tests/rename-fixtures.test.js tests/schema.test.js --coverage.enabled=false
      - name: Rename guard (protected identifiers at their use sites; public names once RENAME_DONE=1)
        if: ${{ !cancelled() }}
        run: node scripts/check-names.mjs .
        env:
          RENAME_DONE: ${{ (inputs.rename_done && '1') || vars.RENAME_DONE_CODEX || '' }}
